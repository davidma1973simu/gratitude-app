<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>留住这束光 — 封面</title>
<style>
  @font-face {
    font-family: 'Satisfy';
    src: url('../v2-care/fonts/satisfy.woff2') format('woff2');
    font-weight: 400; font-style: normal; font-display: block;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --paper: #f7f3ed;
    --ink: #23201c;
    --ink-soft: #6c645b;
    --ink-faint: #9a9086;
    --accent: #0e6b50;
  }

  html, body { width: 1080px; height: 1440px; }

  body {
    background: var(--paper);
    font-family: 'PingFang SC', 'Helvetica Neue', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    position: relative;
    overflow: hidden;
  }

  /* 光：右上角一束漫射的暖光，落在纸面上 */
  .glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(56% 42% at 86% 6%, rgba(255, 209, 158, 0.50) 0%, rgba(255, 226, 196, 0.24) 40%, rgba(247, 243, 237, 0) 72%),
      radial-gradient(50% 44% at 6% 94%, rgba(206, 201, 191, 0.30) 0%, rgba(247, 243, 237, 0) 70%);
  }

  .grain {
    position: absolute; inset: 0; opacity: 0.30; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='0.16'/></svg>");
  }

  .stage { position: absolute; inset: 0; }

  /* ── 品牌标记 ─────────────────────────────── */
  .mark {
    position: absolute; left: 96px; top: 88px;
    display: flex; align-items: center; gap: 12px;
  }
  .mark svg { display: block; }
  .mark-text {
    font-size: 11px; letter-spacing: 0.40em; color: var(--ink-faint);
    text-transform: uppercase; padding-left: 3px;
  }

  /* ── 标题 ─────────────────────────────────── */
  .title-block { position: absolute; left: 96px; top: 168px; }
  h1 {
    font-size: 96px; font-weight: 200; letter-spacing: 0.12em;
    color: var(--ink); line-height: 1.2; padding-left: 6px;
  }
  .rule {
    width: 48px; height: 1px; background: rgba(35,32,28,0.30);
    margin: 32px 0 22px 8px;
  }
  .sub {
    font-size: 12.5px; letter-spacing: 0.36em; color: var(--ink-soft);
    text-transform: uppercase; padding-left: 8px;
  }
  .sub .cn { letter-spacing: 0.3em; }
  .sub .sep { color: var(--ink-faint); margin: 0 10px; }

  /* ── 宝利来相片 ───────────────────────────── */
  .polaroid {
    position: absolute; right: 92px; top: 512px;
    width: 548px; background: #fffdf9;
    padding: 16px 16px 0 16px;
    box-shadow:
      0 1px 2px rgba(40, 32, 24, 0.07),
      0 14px 34px rgba(40, 32, 24, 0.13),
      0 46px 84px rgba(40, 32, 24, 0.10);
    transform: rotate(-2.4deg);
    transform-origin: 50% 45%;
  }
  .photo {
    width: 516px; height: 516px; overflow: hidden;
    background: #e9e2d7; position: relative;
  }
  .photo img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    filter: saturate(0.74) contrast(0.92) brightness(1.08);
  }
  .photo::after {
    content: ''; position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(255, 236, 214, 0.20) 0%, rgba(250, 240, 228, 0.14) 55%, rgba(244, 236, 226, 0.24) 100%);
  }
  .sig {
    position: absolute; left: 26px; top: 476px;
    font-family: 'Satisfy', cursive;
    font-size: 68px; line-height: 1; color: rgba(18, 14, 10, 0.80);
    transform: rotate(-5deg); transform-origin: left center;
    white-space: nowrap;
  }
  .cap { padding: 24px 14px 34px 14px; text-align: right; }
  .cap .date {
    font-size: 13.5px; letter-spacing: 0.18em; color: var(--ink-faint);
    margin-bottom: 11px;
  }
  .cap .line {
    font-size: 19.5px; line-height: 1.72; color: #3a342d; font-weight: 300;
    letter-spacing: 0.02em;
  }

  /* ── 左侧文案 ─────────────────────────────── */
  .quote { position: absolute; left: 96px; top: 420px; width: 296px; }
  .quote p {
    font-size: 18px; line-height: 2.1; color: var(--ink-soft);
    font-weight: 300; letter-spacing: 0.06em;
  }
  .quote .en {
    margin-top: 34px; padding-top: 22px;
    border-top: 1px solid rgba(35,32,28,0.12);
    font-size: 11.5px; letter-spacing: 0.10em; line-height: 2.0;
    color: var(--ink-faint); font-style: italic; font-weight: 300;
  }

  /* ── 底部 ─────────────────────────────────── */
  .foot {
    position: absolute; left: 96px; bottom: 72px; right: 96px;
    display: flex; align-items: baseline; justify-content: space-between;
  }
  .foot .url { font-size: 12px; letter-spacing: 0.10em; color: var(--ink-faint); }
  .foot .ver { font-size: 10px; letter-spacing: 0.18em; color: var(--ink-faint); opacity: 0.75; }

  /* ══════════════════════════════════════════════
     变体 B：中轴对称（海报式）
     ══════════════════════════════════════════════ */
  body.center .mark { left: 50%; transform: translateX(-50%); top: 92px; }
  body.center .title-block { left: 50%; transform: translateX(-50%); top: 172px; text-align: center; }
  body.center h1 { padding-left: 0; letter-spacing: 0.16em; font-size: 92px; }
  body.center .rule { margin: 30px auto 20px; }
  body.center .sub { padding-left: 0; }
  body.center .glow {
    background:
      radial-gradient(52% 38% at 50% 4%, rgba(255, 211, 163, 0.46) 0%, rgba(255, 228, 198, 0.20) 44%, rgba(247, 243, 237, 0) 74%),
      radial-gradient(60% 40% at 50% 100%, rgba(203, 198, 188, 0.28) 0%, rgba(247, 243, 237, 0) 70%);
  }
  body.center .polaroid {
    right: auto; left: 50%; top: 442px;
    width: 500px; padding: 14px 14px 0 14px;
    transform: translateX(-50%) rotate(-2deg);
  }
  body.center .photo { width: 472px; height: 472px; }
  body.center .sig { left: 22px; top: 436px; font-size: 64px; }
  body.center .cap { padding: 20px 10px 28px 10px; }
  body.center .cap .line { font-size: 18px; }
  body.center .quote {
    left: 50%; transform: translateX(-50%); top: 1128px; width: 560px;
    text-align: center;
  }
  body.center .quote p { font-size: 17.5px; line-height: 1.9; }
  body.center .quote .en {
    margin-top: 16px; padding-top: 0; border-top: none;
  }
  body.center .foot { left: 50%; transform: translateX(-50%); right: auto; bottom: 56px; gap: 18px; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grain"></div>

  <div class="stage">
    <div class="mark">
      <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
        <circle cx="16" cy="16" r="15" stroke="#0e6b50" stroke-opacity="0.20" stroke-width="1"/>
        <path d="M16 24c0-6.5 3.4-10.4 8-11.6.8 5.6-2.6 10.2-8 11.6Z" fill="#0e6b50" fill-opacity="0.68"/>
        <path d="M16 24c0-6.5-3.4-10.4-8-11.6-.8 5.6 2.6 10.2 8 11.6Z" fill="#0e6b50" fill-opacity="0.34"/>
        <path d="M16 24V10" stroke="#0e6b50" stroke-opacity="0.50" stroke-width="1" stroke-linecap="round"/>
      </svg>
      <span class="mark-text">Gratitude</span>
    </div>

    <div class="title-block">
      <h1>留住这束光</h1>
      <div class="rule"></div>
      <div class="sub"><span class="cn">感恩日记</span> <span class="sep">/</span> A Gratitude Journal</div>
    </div>

    <div class="polaroid">
      <div class="photo"><img src="../v2-care/images/warm/warm-01.jpg" alt=""></div>
      <div class="sig">peaceful</div>
      <div class="cap">
        <div class="date">2026.10.22</div>
        <div class="line">雨停了，路灯下的水洼里<br>有一小片月亮。</div>
      </div>
    </div>

    <div class="quote">
      <p>不催你写的感恩日记。<br>它只是等光来。</p>
      <div class="en">No streaks. No guilt.<br>Just notice what came.</div>
    </div>

    <div class="foot">
      <div class="url">gratitude-v2.app.workbuddy.host</div>
      <div class="ver">V2-CARE · V2.0.0</div>
    </div>
  </div>

  <script>
    if (new URLSearchParams(location.search).get('v') === 'center') {
      document.body.classList.add('center');
    }
  </script>
</body>
</html>
