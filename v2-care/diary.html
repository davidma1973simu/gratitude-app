<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#0E6B50">
  <title>光之日记 · Gratitude</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-title" content="光之日记">
  <!-- html2canvas for card export -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
  <script src="backend.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }

    :root {
      --bg: #fefcf9;
      --surface: #ffffff;
      --surface-hover: #fdf6f0;
      --border: #f0d9d0;
      --border-light: #fceeed;
      --text-primary: #3d2b1f;
      --text-secondary: #7a5c4a;
      --text-tertiary: #b8967a;
  --accent: #0E6B50;
  --accent-soft: #e8f0ec;
      --danger: #d46868;
      --radius: 16px;
      --radius-lg: 24px;
      --shadow-sm: 0 2px 8px rgba(180,120,80,0.07);
      --shadow-md: 0 8px 32px rgba(180,120,80,0.13);
      --shadow-lg: 0 12px 48px rgba(180,120,80,0.18);
      --emotion-warm: #e8a87c;
      --emotion-calm: #7fb3a8;
      --emotion-hopeful: #d4b87a;
      --emotion-gentle: #c99bb5;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    body { display: flex; flex-direction: column; min-height: 100dvh; }

    /* ─── Nav ─── */
    .nav {
      position: sticky; top: 0; z-index: 50;
      background: rgba(254,252,249,0.88);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--border-light);
      padding: 0 20px;
      height: 56px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-back {
      display: flex; align-items: center; gap: 6px;
      font-size: 14px; color: var(--text-secondary);
      cursor: pointer; background: none; border: none;
      padding: 6px 10px; border-radius: 10px;
      transition: background 0.15s ease; font-family: inherit;
    }
    .nav-back:hover { background: var(--accent-soft); }
    .nav-title { font-size: 15px; font-weight: 600; color: var(--text-primary); letter-spacing: 0.5px; }
    .nav-right { width: 60px; display: flex; align-items: center; justify-content: flex-end; }
    .nav-settings {
      width: 32px; height: 32px; border-radius: 8px;
      background: none; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-tertiary); transition: all 0.15s ease;
    }
    .nav-settings:hover { background: var(--accent-soft); color: var(--accent); }

    /* ─── Main ─── */
    main { flex:1; padding: 24px 20px 120px; max-width: 600px; margin:0 auto; width:100%; }

    .page-header { margin-bottom: 22px; text-align: center; }
    .page-header h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.4px; color: var(--text-primary); margin-bottom: 5px; }
    .page-header p { font-size: 13.5px; color: var(--text-tertiary); letter-spacing: 0.3px; }

    /* ─── Input Area ─── */
    .input-section {
      background: var(--surface); border: 1px solid var(--border-light);
      border-radius: var(--radius-lg); padding: 20px; margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
    }
    .input-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .input-label { font-size: 13px; color: var(--text-tertiary); font-weight: 500; letter-spacing: 0.3px; }
    .import-btn {
      font-size: 12px; color: var(--accent); background: none; border: 1px solid var(--border);
      border-radius: 8px; padding: 4px 10px; cursor: pointer;
      transition: all 0.15s ease; font-family: inherit;
    }
    .import-btn:hover { background: var(--accent-soft); border-color: var(--accent); }
    .import-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .input-textarea {
      width:100%; border:none; outline:none; resize:none;
      font-size: 15.5px; line-height: 1.75; color: var(--text-primary);
      background: transparent; font-family: inherit; min-height: 100px; max-height: 300px; padding:0;
    }
    .input-textarea::placeholder { color: var(--text-tertiary); opacity: 0.6; }

    .input-divider { height: 1px; background: var(--border-light); margin: 14px 0; }

    .attachment-bar { display: flex; gap: 8px; flex-wrap: wrap; }
    .attach-btn {
      display: flex; align-items: center; gap: 5px; padding: 7px 12px;
      border-radius: 10px; border: 1px dashed var(--border); background: transparent;
      color: var(--text-tertiary); font-size: 12.5px; cursor: pointer;
      transition: all 0.15s ease; font-family: inherit;
    }
    .attach-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    .attach-btn svg { flex-shrink: 0; }
    .attach-btn.recording {
      border-color: var(--danger); color: var(--danger);
      background: rgba(212,104,104,0.06);
      animation: recordPulse 1.2s ease-in-out infinite;
    }
    @keyframes recordPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(212,104,104,0.15); }
      50% { box-shadow: 0 0 0 6px rgba(212,104,104,0); }
    }

    .preview-area { display: none; margin-top: 14px; gap: 10px; flex-wrap: wrap; }
    .preview-area.has-content { display: flex; }
    .preview-item {
      position:relative; width:72px; height:72px; border-radius: 12px;
      overflow:hidden; border: 1px solid var(--border-light); flex-shrink: 0;
    }
    .preview-item img { width:100%; height:100%; object-fit: cover; }
    .preview-item.audio-preview {
      width:auto; padding:8px 14px; background: var(--accent-soft);
      display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-secondary);
    }
    .preview-remove {
      position:absolute; top:3px; right:3px; width:20px; height:20px;
      border-radius:50%; background:rgba(61,43,31,0.65); color:white;
      border:none; cursor:pointer; font-size:11px; line-height:20px;
      text-align:center; display:flex; align-items:center; justify-content:center;
    }
    .preview-remove:hover { background: var(--danger); }

    /* ─── Generate Button ─── */
    .generate-btn {
      width:100%; padding:14px; border-radius: var(--radius); border:none;
      background: linear-gradient(135deg, #0E6B50, #0d8a5f); color:white;
      font-size:15px; font-weight:700; cursor:pointer; transition: all 0.22s ease;
      box-shadow: 0 3px 16px rgba(14,107,80,0.28); letter-spacing: 0.5px; margin-bottom: 20px;
    }
    .generate-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(14,107,80,0.38); }
    .generate-btn:active { transform: translateY(0); }
    .generate-btn:disabled { opacity:0.5; cursor:not-allowed; transform:none; }

    /* ─── Loading ─── */
    .loading { display:none; text-align:center; padding:48px 20px; color:var(--text-tertiary); font-size:14px; }
    .loading.active { display:block; }
    .loading-dots { display:inline-flex; gap:5px; margin-top:14px; }
    .loading-dot { width:7px; height:7px; border-radius:50%; background:var(--accent); animation: loadinDot 1.2s ease-in-out infinite; }
    .loading-dot:nth-child(2) { animation-delay: 0.2s; }
    .loading-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes loadinDot { 0%,80%,100%{opacity:0.3;transform:scale(0.8)} 40%{opacity:1;transform:scale(1.1)} }

    /* ══════════════════════════════════════
       OUTPUT SECTION — 一页日记（方向 A，2026-10-25）
       点阵纸 + 装订线 + 日期 + 温度带 + 正文 + 铅笔旁注 + 粘贴相片 + 落款
       ══════════════════════════════════════ */
    .output-section {
      display: none;
      position: relative;
      border-radius: 6px;
      overflow: hidden;
      background: #fbf7ef;
      box-shadow: 0 12px 44px rgba(120,100,70,0.16), 0 1px 3px rgba(120,100,70,0.08);
      margin-bottom: 24px;
    }
    .output-section.active { display: block; }
    /* 点阵纸底：data-uri SVG 平铺 —— html2canvas 导出时不会丢 */
    .paper-bg {
      position: absolute; inset: 0; pointer-events: none;
      background-color: #fbf7ef;
      background-image: url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16'%3E%3Ccircle cx='1' cy='1' r='0.85' fill='%23cdbfa8' fill-opacity='0.5'/%3E%3C/svg%3E");
      background-size: 16px 16px;
      background-repeat: repeat;
    }
    /* 装订红线 */
    .paper-margin {
      position: absolute; top: 0; bottom: 0; left: 27px; width: 1px;
      background: rgba(196,92,80,0.24); pointer-events: none;
    }
    .output-inner {
      position: relative; z-index: 1;
      padding: 30px 22px 26px 44px;
    }

    /* Date + Tag row */
    .output-header-row {
      display: flex; align-items: flex-start; justify-content: space-between;
    }
    .output-date-big {
      font-size: 46px; font-weight: 600; line-height: 0.92;
      color: #332c25; letter-spacing: -1.5px;
    }
    .output-date-sub {
      font-size: 10px; color: #a1968a;
      margin-top: 7px; letter-spacing: 0.2em;
    }
    .output-tag {
      margin-top: 2px; display: inline-block; padding: 5px 11px;
      border-radius: 99px; white-space: nowrap;
      border: 1px solid rgba(14,107,80,0.26);
      background: rgba(255,255,255,0.55);
      color: var(--accent); font-size: 10px; letter-spacing: 0.12em;
      transform: rotate(-3deg);
    }

    /* ─── 温度带：一条线 + 一枚指针，取代 4×7 点阵 ─── */
    .mood { display: flex; align-items: center; gap: 10px; margin-top: 20px; }
    .mood-word { font-size: 11px; letter-spacing: 0.14em; color: #8a7b6a; white-space: nowrap; }
    .mood-track {
      position: relative; flex: 1; height: 3px; border-radius: 3px;
      background: linear-gradient(90deg, #8fbcb2 0%, #cfc39a 42%, #e8b07a 72%, #d98f6a 100%);
    }
    .mood-pin {
      position: absolute; top: 50%; width: 9px; height: 9px;
      margin: -4.5px 0 0 -4.5px; border-radius: 50%;
      background: #fff; border: 1.5px solid #d98f6a;
      box-shadow: 0 0 0 3px rgba(217,143,106,0.16);
    }
    .mood-score { font-size: 11px; color: #a1968a; font-variant-numeric: tabular-nums; }

    /* ─── 相片：贴在纸上的宝利来，位置与宽度不再挤压正文 ─── */
    .output-image-block {
      margin: 26px auto 2px; width: 76%; max-width: 300px;
      padding: 7px 7px 22px; background: #fffdfa;
      transform: rotate(-1.8deg);
      box-shadow: 0 6px 18px rgba(40,32,24,0.16), 0 1px 2px rgba(40,32,24,0.08);
      position: relative;
    }
    /* 一小段胶带，让这张相片像"贴"上去的 */
    .photo-tape {
      position: absolute; top: -10px; left: 50%; width: 62px; height: 19px;
      margin-left: -31px; background: rgba(232,220,190,0.78);
      transform: rotate(-3deg);
      box-shadow: 0 1px 2px rgba(40,32,24,0.08);
    }
    .output-image-wrap {
      position: relative; width: 100%; height: 0; padding-bottom: 75%;
      overflow: hidden; background: #f3ece4;
    }
    .output-image {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; object-fit: cover; object-position: center;
    }
    @media (max-width: 440px) {
      .output-image-block { width: 88%; max-width: none; }
    }

    /* ─── 一天的第一句话：把三条并置成一段第一人称的陈诉 ─── */
    .diary-epigraph {
      display: flex; gap: 8px; align-items: flex-start;
      font-size: 14px; line-height: 1.95;
      color: #6f6659;
      letter-spacing: 0.02em;
      font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
      margin: 24px 0 0;
    }
    .diary-epigraph .epi-mark {
      flex: none; font-size: 9px; line-height: 2.9;
      color: var(--accent); opacity: 0.6;
    }
    .diary-epigraph[hidden] { display: none; }

    /* ─── 正文：日记主体（不用手写体，靠字号、行距和留白撑住） ─── */
    .diary-user-input {
      margin-top: 18px;
      font-size: 18px; line-height: 2.0;
      color: #332c25;
      font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
      font-weight: 500;
      letter-spacing: 0.01em;
      white-space: pre-wrap; word-break: break-word;
    }
    .diary-user-input[contenteditable="true"] {
      outline: none; border-radius: 6px;
      padding: 6px; margin: 12px -6px 0;
      transition: background 0.15s;
    }
    .diary-user-input[contenteditable="true"]:focus { background: rgba(14,107,80,0.04); }

    /* ─── AI wrapper text：比正文低一档，像接着写下去的一小段 ─── */
    .diary-ai-text {
      margin-top: 10px;
      font-size: 14px; line-height: 1.95;
      color: #5f574d;
      white-space: pre-wrap; word-break: break-word;
      font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
    }

    .diary-edit-hint {
      display: inline-block; font-size: 10px; color: var(--text-tertiary);
      opacity: 0.35; margin-left: 5px;
    }

    /* ─── 情绪洞察：正文下面的铅笔旁注，不再是一块灰卡片 ─── */
    .diary-note {
      margin-top: 14px;
      font-size: 13px; line-height: 1.9;
      color: #9a8f83;
      letter-spacing: 0.01em;
    }
    .diary-note::before { content: '↳ '; color: #bfb4a6; }
    .diary-note[hidden] { display: none; }

    /* User attachments row */
    .output-attachments {
      display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap;
    }
    .output-attachment-img {
      width: 48px; height: 48px; border-radius: 10px;
      object-fit: cover; border: 1px solid var(--border-light);
    }
    .output-attachment-audio {
      display: flex; align-items: center; gap: 5px;
      padding: 6px 11px; background: var(--accent-soft);
      border-radius: 8px; font-size: 11.5px; color: var(--text-secondary);
    }

    /* ─── Tome：落款 —— 小标签在上，一句话在下，永远只占一行 ─── */
    .output-tome {
      margin-top: 26px;
      padding-top: 15px;
      border-top: 1px solid rgba(150,132,108,0.22);
    }
    .output-tome .tome-label {
      display: block; margin-bottom: 9px;
      font-size: 9.5px; letter-spacing: 0.24em; color: #b3a89b;
    }
    .output-tome .tome-line {
      font-size: 16px; line-height: 1.7;
      color: #4a423a; letter-spacing: 0.01em;
      white-space: nowrap; overflow: hidden;
    }

    /* ─── Actions：一个主按钮 + 一条淡文字 ─── */
    .output-actions {
      margin-top: 22px;
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    }
    .output-action-btn {
      font-family: inherit; cursor: pointer;
      transition: opacity 0.15s ease;
    }
    .output-action-btn.primary {
      background: var(--accent); color: #fff;
      border: none; border-radius: 10px;
      padding: 11px 20px;
      font-size: 13.5px; letter-spacing: 0.03em;
    }
    .output-action-btn.primary:hover { opacity: 0.9; }
    .output-action-btn.primary:disabled { opacity: 0.6; cursor: default; }
    .output-action-btn.share-link {
      background: none; border: none; padding: 0;
      color: #9a8f83; font-size: 12.5px; letter-spacing: 0.04em;
    }
    .output-action-btn.share-link:hover { color: var(--accent); }

    /* ══════════════════════════════════════
       分享面板
       ══════════════════════════════════════ */
    .share-sheet { position: fixed; inset: 0; z-index: 190; pointer-events: none; }
    .share-sheet-mask {
      position: absolute; inset: 0; background: rgba(24,20,16,0.42);
      opacity: 0; transition: opacity 0.28s ease;
      -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
    }
    .share-sheet-panel {
      position: absolute; left: 0; right: 0; bottom: 0;
      background: #fffefb; border-radius: 20px 20px 0 0;
      padding: 14px 22px calc(24px + env(safe-area-inset-bottom, 0px));
      transform: translateY(101%);
      transition: transform 0.32s cubic-bezier(0.22,0.68,0.32,1);
      box-shadow: 0 -14px 44px rgba(24,20,16,0.22);
    }
    .share-sheet.show { pointer-events: auto; }
    .share-sheet.show .share-sheet-mask { opacity: 1; }
    .share-sheet.show .share-sheet-panel { transform: translateY(0); }
    .sheet-grab { width: 38px; height: 4px; border-radius: 4px; background: #ded5c7; margin: 0 auto 14px; }
    .sheet-title { font-size: 11.5px; letter-spacing: 0.14em; color: #9a8f83; text-align: center; margin-bottom: 18px; }
    .sheet-grid { display: flex; justify-content: space-between; gap: 4px; }
    .sheet-item {
      background: none; border: none; padding: 0; font-family: inherit;
      cursor: pointer; width: 60px; text-align: center;
    }
    .sheet-ico {
      width: 46px; height: 46px; margin: 0 auto 8px; border-radius: 50%;
      border: 1px solid rgba(120,108,92,0.22); background: #fdfbf7; color: #57503f;
      display: flex; align-items: center; justify-content: center;
    }
    .sheet-ico svg { width: 22px; height: 22px; }
    .sheet-item em { display: block; font-style: normal; font-size: 10.5px; color: #7d7264; letter-spacing: 0.02em; }
    .sheet-item.hero .sheet-ico {
      background: rgba(14,107,80,0.06); border-color: rgba(14,107,80,0.32); color: var(--accent);
    }
    .sheet-note { margin-top: 14px; font-size: 10px; line-height: 1.7; color: #b0a598; text-align: center; }
    .sheet-save {
      margin-top: 14px; width: 100%; padding: 12px; border-radius: 10px; border: none;
      background: var(--accent); color: #fff; font-size: 13.5px; font-family: inherit;
      letter-spacing: 0.03em; cursor: pointer;
    }
    .sheet-copy {
      margin: 12px auto 0; display: block; background: none; border: none; padding: 4px;
      font-size: 11.5px; color: #a89d90; font-family: inherit; letter-spacing: 0.04em; cursor: pointer;
    }
    .output-action-btn.primary:hover { box-shadow: 0 3px 14px rgba(14,107,80,0.28); }

    /* ─── Animations ─── */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in-up { animation: fadeInUp 0.5s cubic-bezier(0.16,1,0.3,1) both; }

    /* ══════════════════════════════════════
       HISTORY SECTION
       ══════════════════════════════════════ */
    .history-section { margin-top: 28px; }
    .history-header {
      font-size: 12px; font-weight: 700; letter-spacing: 1.2px;
      text-transform: uppercase; color: var(--text-tertiary);
      margin-bottom: 12px; display: flex; align-items: center; gap: 5px;
    }
    .history-empty {
      text-align: center; padding: 36px 18px; color: var(--text-tertiary);
      font-size: 13px; line-height: 1.75;
    }
    .history-empty-icon { font-size: 24px; margin-bottom: 6px; opacity: 0.45; }
    .history-item {
      background: var(--surface); border: 1px solid var(--border-light);
      border-radius: 14px; padding: 14px 16px; margin-bottom: 8px;
      cursor: pointer; transition: all 0.15s ease;
      box-shadow: 0 1px 6px rgba(180,120,80,0.05);
    }
    .history-item:hover { border-color: var(--border); box-shadow: 0 3px 14px rgba(180,120,80,0.1); }
    .history-item-date {
      font-size: 11.5px; color: var(--text-tertiary); margin-bottom: 5px;
      letter-spacing: 0.2px;
    }
    .history-item-preview {
      font-size: 13.5px; line-height: 1.65; color: var(--text-secondary);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .history-item-tag {
      display: inline-block; margin-top: 6px;
      font-size: 10px; letter-spacing: 0.4px;
      padding: 2px 7px; border-radius: 7px;
    }
    /* Share hint bar */
    .share-hint-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(62,43,31,0.92); color: #fefcf9;
      padding: 13px 20px; z-index: 150;
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; font-size: 12.5px; line-height: 1.5;
      transform: translateY(100%); opacity: 0;
      transition: all 0.4s cubic-bezier(0.16,1,0.3,1);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    .share-hint-bar.show { transform: translateY(0); opacity: 1; }

    /* ─── Gentle question — a quiet reflection after writing (no new channel) ─── */
    .gentle-area {
      margin: 18px auto 0;
      max-width: 520px;
      padding: 0 4px;
      opacity: 0;
      transition: opacity 1s ease;
      cursor: pointer;
      user-select: none;
      text-align: center;
    }

<script>
// ══════════════════════════════════════
// Settings
// ══════════════════════════════════════
function toggleSettings(force){
  var panel = document.getElementById('settingsPanel');
  var open = (typeof force === 'boolean') ? force : !panel.classList.contains('active');
  if(open){
    var key = localStorage.getItem('diary_ai_key') || '';
    document.getElementById('apiKeyInput').value = key;
    document.getElementById('settingsStatus').className = 'settings-status';
    document.getElementById('settingsStatus').textContent = '';
    panel.classList.add('active');
    setTimeout(function(){ document.getElementById('apiKeyInput').focus(); }, 120);
  } else {
    panel.classList.remove('active');
    document.activeElement && document.activeElement.blur && document.activeElement.blur();
  }
}
function saveSettings(){
  var key = document.getElementById('apiKeyInput').value.trim();
  var status = document.getElementById('settingsStatus');
  if(!key){
    localStorage.removeItem('diary_ai_key');
  } else if(!key.startsWith('sk-')){
    status.className = 'settings-status err';
    status.textContent = 'Key 格式不正确，应以 sk- 开头';
    return;
  } else {
    localStorage.setItem('diary_ai_key', key);
  }
  // 保存即关闭 —— 不做停留式反馈
  toggleSettings(false);
  showNotification(key ? '已保存 ✦' : '已清除 Key');
}

// 支持：回车保存 / Esc 关闭 / 点击遮罩关闭
document.addEventListener('keydown', function(e){
  var panel = document.getElementById('settingsPanel');
  if(!panel.classList.contains('active')) return;
  if(e.key === 'Enter'){ e.preventDefault(); saveSettings(); }
  if(e.key === 'Escape'){ toggleSettings(false); }
});
document.getElementById('settingsPanel').addEventListener('click', function(e){
  if(e.target === this) toggleSettings(false);
});

// ══════════════════════════════════════
// State
// ══════════════════════════════════════
var attachedImages = [];
var attachedAudio = null;
var mediaRecorder = null;
var recordingStream = null;
var recordingTimer = null;
var recordingSeconds = 0;

// 图片池：只收「高感性、正能量、无人像」的画面（光/海/天空/花/山野）
// ⚠️ calm-01、warm-03、warm-06 是人像（男/女大头照），2026-10-26 已从仓库物理删除，
//    任何图池都不得再引用这三个文件名。gentle-01 / gentle-03 有人物，也不进池。
// 光之日记的图片语言：暖、亲和、明亮、快乐、积极
// ⚠️ 与宝利来池（index.html 的 images/polaroid/，冷调低饱和）刻意不共用：
//    日记是白天的、可读的、舒展的；卡片是黄昏的、留白的、感性的。
var DIARY_POOL = [
  'images/warm/warm-01.jpg',      // 海面落日与栈桥
  'images/warm/warm-02.jpg',      // 光穿过树冠
  'images/warm/warm-04.jpg',      // 傍晚并肩骑行（远景剪影，无面部）
  'images/hopeful/hopeful-01.jpg',// 日出草原
  'images/hopeful/hopeful-03.jpg',// 绿色山丘
  'images/hopeful/hopeful-04.jpg',// 粉调海滩落日
  'images/gentle/gentle-02.jpg',  // 野花
  'images/gentle/gentle-04.jpg',  // 向日葵
  'images/gentle/gentle-05.jpg'   // 紫色花田落日
];

var EMOTION_KEYWORDS = {
  warm: ['爱','温暖','家人','朋友','陪伴','拥抱','谢谢','感激','关心','照顾','在一起','想念','幸福','甜蜜','牵手','微笑','开心','快乐','喜欢','妈妈','爸爸'],
  calm: ['平静','安静','安宁','放松','呼吸','冥想','独处','散步','发呆','慢下来','宁静','舒适','悠闲'],
  hopeful: ['希望','期待','明天','未来','梦想','目标','进步','成长','新的','开始','机会','阳光','日出','花开'],
  gentle: ['温柔','细腻','柔软','花瓣','叶子','雨','风','天空','云','水','自然','美好','感动','眼泪','心疼','珍惜']
};

var currentEmotion = null;
var currentDiaryKey = null; // track which saved diary is showing

// ══════════════════════════════════════
// Init
// ══════════════════════════════════════
document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('outputSection').classList.remove('active');
  document.getElementById('loadingSection').classList.remove('active');
  restoreDraft();
  updateImportButton();
  renderHistory();
  setTimeout(function() {
    document.querySelectorAll('.delay-1,.delay-2').forEach(function(el,i){ el.style.animationDelay=(i*0.08)+'s'; });
  }, 50);
});

// ── 云端模式登录门禁：未登录跳回登录页；已登录则拉取云端感恩条目 ──
if (SB.isCloud) {
  var _diaryMain = document.querySelector('main');
  if (_diaryMain) _diaryMain.style.visibility = 'hidden';
  SB.ensureSession().then(function(session){
    if (session && session.user) {
      if (_diaryMain) _diaryMain.style.visibility = '';
      var gb = document.getElementById('settingsBtn'); if (gb) gb.style.display = 'none'; // 云端无 Key，无需 DeepSeek Key
      loadCloudEntriesForDiary().then(updateImportButton);
    } else {
      window.location.replace('index.html');
    }
  }).catch(function(){ window.location.replace('index.html'); });
}

// ══════════════════════════════════════
// Import Today's Gratitude
// ══════════════════════════════════════
function updateImportButton() {
  var btn = document.getElementById('importBtn');
  var todayKey = getTodayKey();
  var entries = loadV1Entries();
  if (entries[todayKey] && entries[todayKey].some(function(e){ return e && e.trim(); })) {
    btn.disabled = false;
    btn.title = '导入今天的感恩记录';
  } else {
    btn.disabled = true;
    btn.title = '今天还没有感恩记录';
  }
}

// 本地有多套历史键格式，两个都读，避免「导入今日感恩」读不到数据：
//   grat_entries_local    → { date: { content1, content2, content3 } }（backend.js 本地模式）
//   gratitude_entries_v1  → { date: [c1, c2, c3] }（index.html 纯本地模式）
// 同键名 index.html 写入，这里必须与它对齐，否则日记永远导入不到内容。
function pickFromAny(source, date, i) {
  if (!source) return '';
  if (Array.isArray(source)) return source[i] || '';
  return source['content' + (i + 1)] || '';
}
function readLocalStore(key) {
  try {
    var raw = localStorage.getItem(key);
    return raw ? (JSON.parse(raw) || {}) : {};
  } catch(e) { return {}; }
}
function localHiddenFlags(date) {
  try {
    var m = JSON.parse(localStorage.getItem('gratitude_hidden_v1')) || {};
    var f = m[date];
    return Array.isArray(f) ? [!!f[0], !!f[1], !!f[2]] : [false, false, false];
  } catch(e) { return [false, false, false]; }
}
function loadV1Entries() {
  // 云端模式：直接返回已加载的云端条目缓存
  if (SB.isCloud) return cloudEntriesCache;
  try {
    var stores = [
      readLocalStore('grat_entries_local'),     // backend.js 本地模式
      readLocalStore('gratitude_entries_v1')    // index.html 纯本地模式（优先）
    ];
    var merged = {};
    stores.forEach(function(obj){
      Object.keys(obj).forEach(function(date){
        merged[date] = obj[date];   // 数组顺序保证后者优先
      });
    });
    var map = {};
    Object.keys(merged).forEach(function(date){
      var f = localHiddenFlags(date);
      // 必须按原始槽位 0/1/2 先套隐藏标记，再过滤空值，否则索引会错位
      var arr = [0,1,2].map(function(i){
        return (f[i] ? '' : pickFromAny(merged[date], date, i));
      }).filter(function(x){ return x && x.trim(); });
      if (arr.length) map[date] = arr;
    });
    return map;
  } catch(e) { return {}; }
}

// 云端模式：从 WB Cloud 拉取感恩条目，写入缓存（供「导入今日感恩」使用）
var cloudEntriesCache = {};
async function loadCloudEntriesForDiary() {
  if (!SB.isCloud) return;
  try {
    var rows = await SB.getEntries();
    cloudEntriesCache = {};
    (rows || []).forEach(function(r){
      // 云端同样尊重隐藏标记：历史里隐藏过的条目不该在日记里重新出现
      var f = Array.isArray(r.hidden) ? [!!r.hidden[0], !!r.hidden[1], !!r.hidden[2]] : [false,false,false];
      var arr = [0,1,2].map(function(i){
        return f[i] ? '' : [r.content1, r.content2, r.content3][i];
      }).filter(function(x){ return x && x.trim(); });
      if (arr.length) cloudEntriesCache[r.date] = arr;
    });
  } catch(e) { cloudEntriesCache = {}; }
}

function getTodayKey() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function importToday() {
  var entries = loadV1Entries();
  var key = getTodayKey();
  var todayEntries = entries[key];
  if (!todayEntries || !todayEntries.some(function(e){ return e && e.trim(); })) {
    showNotification('今天还没有感恩记录');
    return;
  }

  var text = document.getElementById('diaryInput').value.trim();
  var importText = todayEntries.filter(function(e){ return e && e.trim(); }).join('\n');
  
  if (text.length > 0) {
    text = text + '\n' + importText;
  } else {
    text = importText;
  }
  
  document.getElementById('diaryInput').value = text;
  saveDraft();
  showNotification('已导入今日的感恩 ✦');
  logEvent('diary_imported_today', { count: todayEntries.filter(function(e){return e&&e.trim()}).length });
}

// ══════════════════════════════════════
// Image Upload / Voice Recording / Preview / Draft
// ══════════════════════════════════════
function handleImages(event) {
  var files = event.target.files;
  if (!files || !files.length) return;
  for (var i=0;i<files.length;i++) (function(file){
    if(!file.type.startsWith('image/'))return;
    var r=new FileReader();r.onload=function(e){
      attachedImages.push({file:file,dataUrl:e.target.result});renderPreviews();saveDraft();
    };r.readAsDataURL(file);
  })(files[i]);
  event.target.value='';
}
function toggleRecording(){ if(mediaRecorder&&mediaRecorder.state==='recording')stopRecording(); else startRecording(); }
function startRecording(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){showNotification('你的浏览器不支持录音');return;}
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    recordingStream=stream;var mt='audio/webm';if(!MediaRecorder.isTypeSupported(mt))mt='audio/mp4';
    mediaRecorder=mt?new MediaRecorder(stream,{mimeType:mt}):new MediaRecorder(stream);
    var chunks=[];mediaRecorder.ondataavailable=function(e){if(e.data&&e.data.size>0)chunks.push(e.data);};
    mediaRecorder.onstop=function(){
      var b=new Blob(chunks,{type:(chunks[0]&&chunks[0].type)||'audio/webm'});
      if(attachedAudio&&attachedAudio.url)URL.revokeObjectURL(attachedAudio.url);
      attachedAudio={blob:b,url:URL.createObjectURL(b),duration:recordingSeconds};
      renderPreviews();saveDraft();
      if(recordingStream){recordingStream.getTracks().forEach(function(t){t.stop();});recordingStream=null;}
    };
    mediaRecorder.start();recordingSeconds=0;
    var btn=document.getElementById('voiceBtn');btn.classList.add('recording');
    document.getElementById('voiceBtnText').textContent='录音中 0:00';
    recordingTimer=setInterval(function(){recordingSeconds++;
      var m=Math.floor(recordingSeconds/60),s=recordingSeconds%60;
      document.getElementById('voiceBtnText').textContent='录音中 '+m+':'+String(s).padStart(2,'0');
    },1000);
  }).catch(function(){showNotification('需要麦克风权限才能录音');});
}
function stopRecording(){ if(mediaRecorder&&mediaRecorder.state==='recording')mediaRecorder.stop();clearInterval(recordingTimer);document.getElementById('voiceBtn').classList.remove('recording');document.getElementById('voiceBtnText').textContent='语音'; }
function renderPreviews(){
  var a=document.getElementById('previewArea');
  if(!attachedImages.length&&!attachedAudio){a.classList.remove('has-content');a.innerHTML='';return;}
  a.classList.add('has-content');var h='';

  if(attachedAudio){var dur=attachedAudio.duration||0;h+='<div class="preview-item audio-preview" style="position:relative;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5,3 19,12 5,21"/></svg> '+Math.floor(dur/60)+':'+String(dur%60).padStart(2,'0')+'<button class="preview-remove" style="position:static;background:none;color:inherit;margin-left:4px;" onclick="removeAudio()">✕</button></div>';}
  a.innerHTML=h;
}
function removeImage(idx){attachedImages.splice(idx,1);renderPreviews();saveDraft();}

// ══════════════════════════════════════
// AI 日记生成（DeepSeek / 云端无 Key）
// ══════════════════════════════════════
function diarySystemPrompt(){
  return '你是一个温暖的感恩日记助手。用户会写下今天感恩的片段，请生成以下内容并以纯JSON格式返回（不要有任何JSON以外的文字，不要加```标记）：\n1. "wrapper": 一段温暖的引导文字（35-65字），放在用户原始输入下方，语气温柔，与用户输入的具体细节相关，不要重复用户原话，而是延伸出一种感受\n2. "emotions": 情绪评分对象，四个维度各0-100的整数：{"warm":80,"calm":60,"hopeful":40,"gentle":70}\n3. "insight": 情绪洞察（30-50字），从用户输入中提取具体的人/事/物名，编织成一句温暖的鼓励，不要模板化通用话\n4. "tome": 致此刻的你下面的一句话，≤20字（硬上限，绝不能超），不能换行；必须是针对这次写下的具体内容说的、收束的、温暖有力量的一句，让人读到自己被看见了；不喊口号（禁止「加油」「你很棒」「你值得」这类通用句），不重复 narrative，不加引号\n5. "narrative": 把这一天写下的几件事并置成一段第一人称的陈诉，≤42字，一句话不换行。铁律：只用用户自己写下的内容，不新增细节、不编造因果、不推测别人的动机、不替用户升华；不出现「感恩」「感谢」「让我明白」「于是我懂了」；不用序号和引号，用逗号或分号把几件事连起来，像一次呼吸。示例：输入「中午的番茄牛腩很好吃；老板把项目机会给了我；路上阿姨对我笑了一下」，narrative 为「中午的番茄牛腩很入味，老板把机会递给了我，路口那位阿姨对我笑了一下。」\n只返回JSON。';
}

// ── 稳健解析模型输出 ──
// ⚠️ 不能只依赖 JSON.parse：真实模型经常带 markdown 围栏、前后说明文字、
//    中文引号或尾随逗号。任何一处失败都会把整段高质量产出丢掉、静默降级成模板，
//    用户看到的就是「功能没实现」。这里逐级降级，能救多少救多少。
function parseAIJson(raw){
  if(!raw) throw new Error('EMPTY_AI');
  var text=String(raw).trim();
  // 1) 去 markdown 围栏
  text=text.replace(/^```[a-zA-Z]*\s*/,'').replace(/```\s*$/,'').trim();
  // 2) 直接解析
  try { return JSON.parse(text); } catch(e){}
  // 3) 截取第一个 { 到最后一个 }（前后夹了说明文字）
  var s=text.indexOf('{'), t=text.lastIndexOf('}');
  if(s>=0 && t>s){
    var slice=text.slice(s,t+1);
    try { return JSON.parse(slice); } catch(e){}
    // 4) 常见脏数据：尾随逗号、中文引号
    try {
      return JSON.parse(slice
        .replace(/,\s*([}\]])/g,'$1')
        .replace(/[\u201c\u201d]/g,'"'));
    } catch(e){}
  }
  // 5) 兜底：逐字段抽取
  function field(name){
    var m=text.match(new RegExp('"'+name+'"\\s*:\\s*"([^"]*)"'));
    return m?m[1]:'';
  }
  var out={ wrapper:field('wrapper'), insight:field('insight'), tome:field('tome'), narrative:field('narrative') };
  if(!out.wrapper && !out.insight && !out.tome && !out.narrative) throw new Error('AI_PARSE_FAILED');
  var em=text.match(/"emotions"\s*:\s*(\{[^}]*\})/);
  if(em){ try { out.emotions=JSON.parse(em[1]); } catch(e){} }
  return out;
}

// 云端模式：调用 WB Cloud 无 Key LLM（流式，自动选模型）
function callCloudLLM(inputText){
  return new Promise(function(resolve,reject){
    var sysTxt=diarySystemPrompt();
    var usrTxt='用户写下：\n'+inputText+'\n\n请返回JSON：';
    SB.callLLM(sysTxt, usrTxt, {temperature:0.82, max_tokens:600}).then(function(text){
      resolve(parseAIJson(text));
    }).catch(function(e){reject(e);});
  });
}

function callDeepSeek(inputText,apiKey){
  return new Promise(function(resolve,reject){
    var ac=new AbortController();
    var tid=setTimeout(function(){ac.abort();},19000);
    var sysTxt=diarySystemPrompt();
    var usrTxt='用户写下：\n'+inputText+'\n\n请返回JSON：';
    fetch('https://api.deepseek.com/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
      body:JSON.stringify({model:'deepseek-chat',messages:[{role:'system',content:sysTxt},{role:'user',content:usrTxt}],temperature:0.82,max_tokens:600}),
      signal:ac.signal
    }).then(function(r){
      clearTimeout(tid);
      if(!r.ok){if(r.status===401)throw new Error('API_KEY_INVALID');throw new Error('API error '+r.status);}
      return r.json();
    }).then(function(data){
      clearTimeout(tid);
      var text=(data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content)||'';
      resolve(parseAIJson(text));
    }).catch(function(e){clearTimeout(tid);reject(e);});
  });
}

// ══════════════════════════════════════
// 一天的第一句话（短版陈述，≤42字）
// 只做「并置」：不编造因果、不添细节。AI 失手时退回原文拼接，不假装智能。
// ══════════════════════════════════════
var NARRATIVE_MAX = 42;

function fallbackNarrative(inp){
  var parts = String(inp||'').split(/\n+/).map(function(t){
    return t.replace(/^[\s\-—•·*·]+/, '').replace(/^[\d一二三四五六七八九]+[.、)）]\s*/, '').trim();
  }).filter(function(t){ return t.length>0; });
  if(!parts.length) return '';
  var s = parts.join('，').replace(/[。；;]+$/,'').replace(/[，,]{2,}/g,'，');
  if(s.length > NARRATIVE_MAX){ s = s.slice(0, NARRATIVE_MAX-1) + '…'; }
  return s;
}

function cleanNarrative(raw, inp){
  var s = String(raw||'').trim();
  s = s.replace(/^[「“‘"'\s]+/, '').replace(/[」”’"'\s]+$/, '');
  s = s.replace(/^(narrative|一句话|今天)[:：]\s*/, '');
  s = s.replace(/\s*\n+\s*/g, '').replace(/^✦\s*/, '');
  if(!s) return fallbackNarrative(inp);
  if(s.length > NARRATIVE_MAX + 4){ s = s.slice(0, NARRATIVE_MAX-1) + '…'; }
  return s;
}

// ══════════════════════════════════════
// Emotion Analysis
// ══════════════════════════════════════
function analyzeEmotions(text){
  var lower=text.toLowerCase(),scores={};
  for(var emo in EMOTION_KEYWORDS){
    var kw=EMOTION_KEYWORDS[emo],hits=0;
    for(var i=0;i<kw.length;i++)if(lower.indexOf(kw[i].toLowerCase())!==-1)hits++;
    scores[emo]=Math.min(Math.round((15+Math.random()*15)+(hits*12)),95);
  }
  var total=scores.warm+scores.calm+scores.hopeful+scores.gentle;
  if(total>0){var s=Math.min(220/total,1.3);for(var e in scores)scores[e]=Math.min(Math.round(scores[e]*s),95);}
  return scores;
}
function getDominantEmotion(s){var best='warm',bs=0;for(var e in s){if(s[e]>bs){bs=s[e];best=e;}}return best;}

// ══════════════════════════════════════
// Diary Parts — split user input vs AI text
// ══════════════════════════════════════
function genDiaryParts(input,emotions){
  var lines=input.split('\n').filter(function(l){return l.trim().length>0;});
  var subjects = extractSubjects(input);

  // User input — keep raw, lightly formatted
  var userText = lines.map(function(l){
    return l.trim().replace(/^[\·\-\*\d\.\、\）\)\】\］]\s*/, '');
  }).join('\n');

  // AI opening — warm, varied
  var openers=['今天有一些温柔的时刻想要记下来。','想把今天的这些光收藏进文字里。','有些小事，但它们让今天变得不一样。','记录下来，怕以后忘了这种感觉。'];
  var opener=openers[Math.floor(Math.random()*openers.length)];

  // AI closer
  var closers=['原来幸福就藏在这些不起眼的瞬间里。','每一天都值得被这样认真地记住。','光一直都在，只是有时候我们忙着赶路没注意到。'];
  var closer=closers[Math.floor(Math.random()*closers.length)];

  // AI wrapper (goes below user input)
  var aiLines = [];
  aiLines.push(opener);
  if(attachedImages.length>0) aiLines.push('（附上了 '+attachedImages.length+' 张照片，想把这一刻的样子留下来）');
  if(attachedAudio) aiLines.push('（还录了一段声音，那个瞬间的声音也很重要）');
  aiLines.push(closer);

  return { userText: userText, aiText: aiLines.join('\n') };
}
function _imgKey(s){
  // 浏览器会把 src 属性解析成绝对地址，统一收敛成「images/xxx/yyy.jpg」再比较
  var m = String(s || '').match(/images\/[^?#]+/);
  return m ? m[0] : '';
}
function pickImage(emo){
  var el = document.getElementById('outputImage');
  var cur = _imgKey(el ? el.getAttribute('src') : '');
  var pool = DIARY_POOL.filter(function(x){ return _imgKey(x) !== cur; });
  if(!pool.length) pool = DIARY_POOL;
  return pool[Math.floor(Math.random()*pool.length)];
}

// 换一张相片。
// 两个坑：① 读历史日记时 currentEmotion 是空的，旧代码 `if(!currentEmotion)return` 直接什么都不做；
//        ② 同一张图命中缓存时 el.onload 不触发，透明度会永远停在 0.3（看起来就是「点了没反应」）。
// 所以：情绪兜底 + 预加载 + 1.2s 强制兜底。
function regenerateImage(){
  var el = document.getElementById('outputImage');
  if(!el) return;
  var next = pickImage(currentEmotion || 'warm');
  el.style.transition = 'opacity 0.24s ease';
  el.style.opacity = '0.22';
  var swapped = false;
  function swap(){
    if(swapped) return;
    swapped = true;
    el.src = next;
    el.style.transition = 'opacity 0.45s ease';
    requestAnimationFrame(function(){ el.style.opacity = '1'; });
    setTimeout(function(){ el.style.opacity = '1'; }, 520);
  }
  var pre = new Image();
  pre.onload = swap;
  pre.onerror = swap;
  pre.src = next;
  setTimeout(swap, 1200);
}

// ══════════════════════════════════════
// Insight — INPUT-AWARE
// ══════════════════════════════════════
function genInsight(input, emotions){
  var subjects = extractSubjects(input);
  var dominant = getDominantEmotion(emotions);
  var score = emotions[dominant];

  var templates = {
    warm_high: function(s) {
      if(s&&s.length>0) return '你在今天里捕捉到了关于「'+s[0]+'」的温暖。这些瞬间之所以珍贵，不是因为它有多宏大，而是因为你愿意停下来感受它。你的心是打开着的，而光总是会找到这样的缝隙照进来。';
      return '今天的文字里有温度。那些被你注意到的瞬间，其实都是生活在向你发出的信号——它一直在等你看见。';
    },
    calm_high: function(s) {
      if(s&&s.length>0) return '你提到了「'+s[0]+'」，这种安静的力量往往比喧嚣更有重量。你正在学会和自己相处，这比任何外在的成就都更难得。';
      return '今天的文字有一种安静的重量。平静不是没有波澜，而是允许一切发生之后，依然能稳稳地接住自己。';
    },
    hopeful_high: function(s) {
      if(s&&s.length>0) return '从「'+s[0]+'」里读出了光的形状。你不是在等未来变好，你是在用每一个微小的感知去建造那个更好的未来。';
      return '你能从日常里读出希望的味道。这不是天生的乐观，是你一次次选择看见光的练习结果。';
    },
    gentle_high: function(s) {
      if(s&&s.length>0) return '你对「'+s[0]+'」的感知这么细腻，说明你的心没有因为忙碌而变得粗糙。敏感不是弱点，它是你和世界之间最温柔的通道。';
      return '你的感知力很细腻。在这个匆忙的世界里，还能被小事打动的人，内心都藏着一片很干净的光。';
    },
    mixed_warm_calm: function(s) {
      return '温暖和平静同时出现在你的文字里。这说明你有能力向外连接，也有空间向内安顿——这是一种很好的平衡，也是一个人真正开始爱自己时的样子。';
    },
    mixed_hopeful_gentle: function(s) {
      return '希望和温柔并存。你既在向往远方，也在珍视手边的小事。这种状态很美，像一束光——既照亮前方，也温暖脚下。';
    },
    default: function(s) {
      if(s&&s.length>0) return '你写下的这些关于「'+s[0]+'」的文字，在未来某一天翻回来的时候，会是自己送给自己的礼物。每一次认真记录，都是在给未来的自己写信。';
      return '每一次记录都是一次自我对话。你愿意把注意力放在美好的事物上，这件事本身就很了不起。';
    }
  };

  var key = dominant+'_'+(score>=50?'high':'');
  if(templates[key]) return templates[key](subjects);
  var sorted=Object.keys(emotions).sort(function(a,b){return emotions[b]-emotions[a]});
  var mixKey='mixed_'+sorted[0]+'_'+sorted[1];
  if(templates[mixKey]) return templates[mixKey](subjects);
  return templates.default(subjects);
}

function extractSubjects(text) {
  var results=[];
  var patterns=[
    /和(.{1,6}?)通电话|跟(.{1,6}?)(聊天|说话|通话)/,
    /看到(.{1,8})|遇见(.{1,8})/,
    /(妈妈|爸爸|朋友|家人|孩子|伴侣|同事|老师|闺蜜)/,
    /(阳光|咖啡|音乐|书|花|猫|狗|海|山|天空|日落|日出|雨|雪)/,
    /坐在(.{1,6})|走在(.{1,6})/,
    /(工作|学习|运动|旅行|散步|做饭|喝茶)/
  ];
  for(var i=0;i<patterns.length;i++){
    var m=text.match(patterns[i]);if(m){for(var j=1;j<m.length;j++){if(m[j]&&results.indexOf(m[j])===-1)results.push(m[j]);}}}
  return results.slice(0,2);
}
// 兜底落款（AI 不可用时）：16-19 字，一句话，尽量贴住用户写下的那个具体的人/物
// ⚠️ 每一条都必须 ≤20 字，超了会被 cleanTome 截断成「…」，看起来像机器出错
function genTome(input,emotions){
  var subjects=extractSubjects(input);
  // 抓到具体的人/物/场景时，只用贴住它的那几句 —— 用户的抱怨就是「泛泛的鼓励」，
  // 混进通用池会让 60% 的落款跟他今天写的事无关。
  if(subjects.length>0){
    var s=subjects[0];
    var own=[
      '今天有「'+s+'」陪着，真好。',
      '记住有「'+s+'」的这一日。',
      '和「'+s+'」有关的光，你留下了。',
      '「'+s+'」在的这一天，值得留着。',
      '这一天，被「'+s+'」照亮过。',
      '「'+s+'」这一笔，你写得很轻很暖。'
    ];
    return own[Math.floor(Math.random()*own.length)];
  }
  var pool=['你选择记下来，而不是让它过去。','允许自己被小事打动的人最真实。','光不挑地方，它照进愿意看见的心里。','今天你收集的光，不会消失。','好好生活，就是把这些碎片捡起来。','这些很小的事，撑住了你的一天。'];
  return pool[Math.floor(Math.random()*pool.length)];
}

function renderOutput(parts, imageUrl, emotions, analysis, tome, narrative){
  var now=new Date();
  document.getElementById('outputDateNum').textContent=now.getDate();
  var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('outputDateStr').textContent=months[now.getMonth()]+' · '+now.getFullYear();

  document.getElementById('outputImage').src=imageUrl;

  // User input — handwriting, large, bold
  document.getElementById('outputUserInput').textContent=parts.userText;

  // AI text — system font, smaller
  document.getElementById('outputAiText').textContent=parts.aiText;

  // 一天的第一句话（AI 并置，无则退回原文拼接；都没有就整块隐藏）
  var epi = document.getElementById('outputEpigraph');
  var epiTxt = document.getElementById('epigraphText');
  var narrText = narrative || cleanNarrative('', parts.userText);
  if (epi && epiTxt) {
    epiTxt.textContent = narrText || '';
    epi.hidden = !narrText;
  }

  renderOutputAttachments();
  renderMoodBar(emotions);
  var analysisEl = document.getElementById('outputAnalysis');
  var analysisTxt = (analysis || '').trim();
  document.getElementById('analysisText').textContent = analysisTxt;
  if (analysisEl) analysisEl.hidden = !analysisTxt;

  // 落款：一句、一行。空的时候整块不出现（避免留一条空横线）
  var tomeEl = document.getElementById('outputTome');
  var tomeLine = document.getElementById('tomeText');
  var tomeTxt = cleanTome(tome);
  tomeLine.textContent = tomeTxt;
  if (tomeEl) tomeEl.hidden = !tomeTxt;
  if (tomeTxt) fitTomeLine(tomeLine);
}

// ── 落款那一句：严格一行 ──
// 25 个字在手机上必然折行，所以先把字数收紧到 20，再把字号从 16px 逐级压到刚好放得下。
// 宁可字小一点，也不能变成两行 —— 那就不再是「一句话」了。
var TOME_MAX = 20;
function cleanTome(raw){
  var s = String(raw || '').trim();
  s = s.replace(/^[「“‘"'\s]+/, '').replace(/[」”’"'\s]+$/, '');
  s = s.replace(/^(tome|致此刻的你)[:：]\s*/, '');
  s = s.replace(/\s*\n+\s*/g, '');
  if(s.length > TOME_MAX) s = s.slice(0, TOME_MAX - 1) + '…';
  return s;
}
function fitTomeLine(el){
  if(!el) return;
  var max = 16, min = 10.5;
  el.style.fontSize = max + 'px';
  var guard = 0;
  while(el.scrollWidth > el.clientWidth + 0.5 && parseFloat(el.style.fontSize) > min && guard++ < 24){
    el.style.fontSize = (parseFloat(el.style.fontSize) - 0.5) + 'px';
  }
}

// 复制 / 下载用的纯文本：第一句话 + 用户原文 + AI 延伸 + 落款那一句
function diaryPlainText(){
  var epi=document.getElementById('outputEpigraph');
  var head=(epi && !epi.hidden && document.getElementById('epigraphText').textContent)? document.getElementById('epigraphText').textContent+'\n\n' : '';
  var tomeEl=document.getElementById('outputTome');
  var tomeLine=document.getElementById('tomeText');
  var tail=(tomeEl && !tomeEl.hidden && tomeLine && tomeLine.textContent.trim())
    ? '\n\n' + tomeLine.textContent.trim() : '';
  return head+document.getElementById('outputUserInput').innerText+'\n'+document.getElementById('outputAiText').innerText+tail;
}

function renderOutputAttachments(){  var c=document.getElementById('outputAttachments');
  if(!attachedImages.length&&!attachedAudio){c.innerHTML='';return;}
  var h='';
  attachedImages.forEach(function(item){h+='<img class="output-attachment-img" src="'+item.dataUrl+'" alt="">';});
  if(attachedAudio)h+='<div class="output-attachment-audio"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5,3 19,12 5,21"/></svg> 语音</div>';
  c.innerHTML=h;
}

// ══════════════════════════════════════
// 温度带（取代 4×7 点阵）
// ══════════════════════════════════════
// 四种情绪里取最强的那一种：一个词、一条线、一枚指针、一个数字。
// 点阵是数据语言，这条线是日记语言 —— 它只回答一件事：今天是暖的还是静的。
function _rgbaOf(hex,a){
  var n=parseInt(hex.replace('#',''),16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
}
function renderMoodBar(scores){
  var container=document.getElementById('emotionBars');
  if(!container) return;
  scores=scores||{};
  var labels={warm:'温暖',calm:'平静',hopeful:'希望',gentle:'温柔'};
  var colors={warm:'#e8a06a',calm:'#7fb3a8',hopeful:'#d8b45a',gentle:'#cfa0b4'};
  var order=['warm','calm','hopeful','gentle'];
  var dom='warm', top=-1;
  for(var i=0;i<order.length;i++){
    var v=Number(scores[order[i]]); if(isNaN(v)) v=0;
    if(v>top){ top=v; dom=order[i]; }
  }
  if(top<0) top=0;
  var pct=Math.max(5,Math.min(95,top));
  container.innerHTML=
    '<span class="mood-word">'+labels[dom]+'</span>'+
    '<span class="mood-track"><i class="mood-pin" style="left:'+pct+'%;border-color:'+colors[dom]+
      ';box-shadow:0 0 0 3px '+_rgbaOf(colors[dom],0.16)+'"></i></span>'+
    '<span class="mood-score">'+Math.round(top)+'</span>';
  var pin=container.querySelector('.mood-pin');
  if(pin){
    pin.style.transform='scale(0)';
    setTimeout(function(){
      pin.style.transition='transform 0.45s cubic-bezier(0.34,1.56,0.64,1)';
      pin.style.transform='scale(1)';
    },120);
  }
}

// ─── Gentle question — a quiet, optional reflection after writing (no new channel) ───
const GENTLE_QUESTIONS_ZH = [
  '写下来之后，有没有哪一刻，你特别想留住？',
  '如果现在有人问你「为什么值得感谢」，你会先说起什么？',
  '这件事，让你心里哪个地方悄悄松了一点？',
  '回头看，你有没有发现自己比以为的更被照顾着？',
  '把它写下的这一秒，你心里是暖的，还是静的？'
];

function showGentleQuestion() {
  var area = document.getElementById('gentleArea');
  var label = document.getElementById('gentleLabel');
  var textEl = document.getElementById('gentleText');

    var out = document.getElementById('outputUserInput');
    if (out) raw = (out.innerText || '').trim();
  }
  if (raw) {
    var clipped = raw.length > 14 ? raw.slice(0, 14) + '…' : raw;
    prefix = '你刚写下：「' + clipped + '」\n';
  }

  label.textContent = '轻轻一问';

function saveDiary(target){
  var tgt = target || '';
  var btn = document.querySelector('.output-action-btn[onclick="saveDiary()"]');
  if(btn){ btn.disabled = true; btn.textContent = '正在生成…'; }

  // Clone card content, strip UI elements that shouldn't appear in image
  var cardEl = document.getElementById('outputSection');
  var clone = cardEl.cloneNode(true);
  clone.style.position = 'absolute';
  clone.style.left = '-9999px';
  clone.style.top = '0';
  clone.style.width = cardEl.offsetWidth + 'px';
  // ⚠️ clone 会把 fade-in-up 一起复制过去，动画在离屏节点上重新播一遍 ——
  //    截图正好落在动画中途，导出的图整页发灰（字像被水洗过）。必须掐掉动画。
  clone.classList.remove('fade-in-up');
  clone.style.animation = 'none';
  clone.style.opacity = '1';
  clone.style.transform = 'none';
  document.body.appendChild(clone);

  // Remove unwanted elements from clone
  var removeSelectors = ['.output-actions', '.diary-edit-hint', '.gentle-area'];
  removeSelectors.forEach(function(sel){
    clone.querySelectorAll(sel).forEach(function(el){ el.remove(); });
  });

  // Remove contenteditable from user input in clone (fixes cursor rendering)
  var userInput = clone.querySelector('.diary-user-input');
  if(userInput) userInput.removeAttribute('contenteditable');

  // 图片：html2canvas 不支持 object-fit / aspect-ratio，会把图拉变形。
  // 导出前改成「固定像素尺寸 + background-size:cover」，视觉上与屏幕一致。
  clone.querySelectorAll('.output-image-wrap').forEach(function(wrap){
    var img = wrap.querySelector('.output-image');
    var src = img ? img.getAttribute('src') : '';
    var w = wrap.offsetWidth || 160;
    var h = wrap.offsetHeight || Math.round(w * 4 / 3);
    wrap.style.width = w + 'px';
    wrap.style.height = h + 'px';
    wrap.style.paddingBottom = '0';
    wrap.style.overflow = 'hidden';
    if(src){
      wrap.style.backgroundImage = 'url("' + src + '")';
      wrap.style.backgroundSize = 'cover';
      wrap.style.backgroundPosition = 'center center';
      wrap.style.backgroundRepeat = 'no-repeat';
    }
    if(img) img.remove();
  });

  html2canvas(clone, {
    scale: 2,
    useCORS: true,
    backgroundColor: '#ffffff',
    logging: false,
    allowTaint: false
  }).then(function(canvas){
    // Download as PNG
    var link = document.createElement('a');
    var dateStr = formatDate(new Date());
    link.download = '光之日记_' + dateStr + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();

    // Cleanup
    document.body.removeChild(clone);
    if(btn){ btn.disabled = false; btn.textContent = '保存图片'; }
    // 分享面板里进来的：图存好了，再接一句「去哪儿发」
    var guide = {
      moments: '已存进相册 · 打开微信发到朋友圈',
      xhs: '已存进相册 · 去小红书发这一篇',
      weibo: '已存进相册 · 去微博发这一条'
    };
    showNotification(guide[tgt] || '这一页已保存 ✦');
    if(tgt) copyDiaryText(true);
    showShareHint();

    // Also persist text data to localStorage (for history)
    persistDiaryData();
    showGentleQuestion();
    logEvent('diary_card_saved',{emotion:currentEmotion});
  }).catch(function(err){
    console.warn('html2canvas error:', err);
    document.body.removeChild(clone);
    if(btn){ btn.disabled = false; btn.textContent = '保存图片'; }
    // Fallback: just persist text data
    persistDiaryData();
    showGentleQuestion();
    showNotification('图片生成失败，已保存文字');
    logEvent('diary_save_fallback');
  });
}

function renderHistory(){
  var container = document.getElementById('historyList');
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem('saved_diaries')||'{}'); } catch(e){}
  
  var keys = Object.keys(saved).sort().reverse();
  
  if(keys.length===0){
    container.innerHTML = '<div class="history-empty"><div class="history-empty-icon">📝</div>保存的日记会在这里出现<br>写下第一篇吧</div>';
    return;
  }
  
  var html = '';
  var emotionLabels = { warm:'温暖', calm:'平静', hopeful:'希望', gentle:'温柔' };
  keys.forEach(function(key){
    var entry = saved[key];
    if(!entry) return;
    var preview = (entry.text||'').replace(/\n/g,' ').substring(0,80);
    var dateStr = key.replace('diary_','');
    var parts = dateStr.split('-');
    var formatted = parts[0]+'年'+parseInt(parts[1])+'月'+parseInt(parts[2])+'日';
    html += '<div class="history-item" onclick="viewDiary(\''+key.replace(/'/g,'\\\'')+'\')">'
          + '<div class="history-item-date">📅 '+formatted+'</div>'
          + '<div class="history-item-preview">'+preview+'</div>'
          + (entry.emotion?'<span class="history-item-tag">'+emotionLabels[entry.emotion]+'</span>':'')
          + '</div>';
  });
  container.innerHTML = html;
}

function viewDiary(key){
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem('saved_diaries')||'{}'); } catch(e){ return; }
  var entry = saved[key];
  if(!entry) return;
  
  // Parse text back into parts (user text + AI text)
  var text = entry.text || '';
  var lines = text.split('\n');
  
  // Show output section
  document.getElementById('outputDateNum').textContent = key.replace('diary_','').split('-')[2] || '—';
  var dateParts = key.replace('diary_','').split('-');
  var months = ['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('outputDateStr').textContent = (months[parseInt(dateParts[1])||''])+' · '+dateParts[0];
  
  // 旧日记里可能存着已经删掉的人像图（calm-01 / warm-03 / warm-06），
  // 或图池外的老路径 —— 一律换成池内的风景，否则翻回历史还会看到那张脸
  var imgSrc = entry.image || '';
  var inPool = DIARY_POOL.some(function(p){ return _imgKey(p) === _imgKey(imgSrc); });
  if(!inPool){
    imgSrc = DIARY_POOL[Math.floor(Math.random() * DIARY_POOL.length)];
    try{ entry.image = imgSrc; saved[key] = entry; localStorage.setItem('saved_diaries', JSON.stringify(saved)); }catch(e){}
  }
  document.getElementById('outputImage').src = imgSrc;
  
  // Split text: first non-empty lines = user input, rest = AI
  var nonEmpty = lines.filter(function(l){ return l.trim().length>0; });
  var userPart = nonEmpty.slice(0,3).join('\n');
  var aiPart = nonEmpty.slice(3).join('\n');
  
  document.getElementById('outputUserInput').textContent = userPart;
  document.getElementById('outputAiText').textContent = aiPart;
  // 旧日记没有存下「第一句话」，直接收起，不留空块
  var _epi=document.getElementById('outputEpigraph'); if(_epi){_epi.hidden=true;}
  
  // Hide emotion/insight/tome for saved diaries (or regenerate)
  document.getElementById('outputSection').classList.add('active');
  document.getElementById('outputSection').classList.add('fade-in-up');
  document.getElementById('outputSection').scrollIntoView({behavior:'smooth',block:'start'});
  
  currentDiaryKey = key;
  logEvent('diary_viewed',{key:key});
}

  var correctBack = basePath + 'index.html';
  history.pushState({diary:true}, '', window.location.href);
  window.addEventListener('popstate', function(e){
    if(mediaRecorder && mediaRecorder.state==='recording') mediaRecorder.stop();
    location.href = correctBack;
  });
})();
</script>
